<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Korean Flashcard App</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 600px; }

    header { text-align: center; margin-bottom: 24px; }
    h1 { font-size: 2rem; color: var(--text); margin-bottom: 8px; }

    .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .tab-btn { background: none; border: none; color: var(--text-muted); padding: 10px 16px; font-size: 1rem; font-weight: 600; cursor: pointer; border-radius: 6px; }
    .tab-btn.active { background-color: var(--accent); color: white; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card-panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; color: var(--text-muted); }
    input { width: 100%; padding: 12px 14px; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 1.1rem; }
    input:focus { outline: none; border-color: var(--accent); }

    .btn { background: var(--accent); color: white; border: none; padding: 12px 20px; font-size: 1rem; font-weight: 600; border-radius: 8px; cursor: pointer; width: 100%; transition: background 0.2s; }
    .btn:hover { background: var(--accent-hover); }

    .search-bar { margin-bottom: 16px; }
    .deck-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .deck-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 16px; position: relative; }
    .deck-card h3 { font-size: 1.4rem; margin-bottom: 6px; color: #60a5fa; }
    .deck-card .def { font-size: 1.05rem; color: var(--text); }
    .delete-btn { position: absolute; top: 12px; right: 12px; background: none; border: none; color: var(--danger); cursor: pointer; font-size: 1.2rem; }

    /* Flashcard Study Area */
    .study-box { perspective: 1000px; width: 100%; height: 280px; margin-bottom: 20px; cursor: pointer; }
    .flashcard { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s; }
    .flashcard.flipped { transform: rotateY(180deg); }
    .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 16px; border: 1px solid var(--border); background: var(--card-bg); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; text-align: center; }
    .card-back { transform: rotateY(180deg); }
    
    .card-face .main-word { font-size: 2.5rem; font-weight: bold; color: #60a5fa; }
    
    .study-controls { display: flex; gap: 12px; justify-content: center; }
    .action-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; }
    .btn-review { background: var(--warning); }
    .btn-master { background: var(--success); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Korean Flashcards</h1>
    </header>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('manage')">Manage Deck</button>
      <button class="tab-btn" onclick="switchTab('study')">Study Mode (<span id="deck-count">0</span>)</button>
    </div>

    <!-- TAB 1: MANAGE & ADD -->
    <div id="manage-tab" class="tab-content active">
      <div class="card-panel">
        <h2 style="margin-bottom: 16px; font-size: 1.2rem;">Add New Word</h2>
        <form id="vocab-form">
          <div class="form-group">
            <label for="kr-word">Korean Word</label>
            <input type="text" id="kr-word" required placeholder="e.g. 감개무량" />
          </div>
          <button type="submit" id="submit-btn" class="btn">Add to Deck</button>
        </form>
      </div>

      <input type="text" id="search-input" class="search-bar" placeholder="Search deck..." oninput="renderDeck()" />
      <div id="deck-grid" class="deck-grid"></div>
    </div>

    <!-- TAB 2: STUDY MODE -->
    <div id="study-tab" class="tab-content">
      <div id="study-container">
        <div class="study-box" onclick="flipCard()">
          <div id="flashcard" class="flashcard">
            <div class="card-face card-front">
              <div id="front-word" class="main-word">---</div>
              <p style="margin-top: 20px; font-size: 0.8rem; color: var(--text-muted);">(Click to flip)</p>
            </div>
            <div class="card-face card-back">
              <div id="back-def" class="main-word" style="font-size: 1.8rem; color: var(--text);">---</div>
            </div>
          </div>
        </div>

        <div class="study-controls">
          <button class="action-btn btn-review" onclick="nextCard()">Need Review</button>
          <button class="action-btn btn-master" onclick="nextCard()">Got It</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let deck = JSON.parse(localStorage.getItem('kr_vocab_deck')) || [];
    let currentIndex = 0;

    function saveDeck() {
      localStorage.setItem('kr_vocab_deck', JSON.stringify(deck));
      document.getElementById('deck-count').innerText = deck.length;
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      if (tab === 'manage') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('manage-tab').classList.add('active');
        renderDeck();
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('study-tab').classList.add('active');
        initStudy();
      }
    }

    // Auto translate using free Google Translate endpoint
    async function translateKorean(text) {
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=en&dt=t&q=${encodeURIComponent(text)}`;
      const res = await fetch(url);
      const data = await res.json();
      return data[0][0][0];
    }

    document.getElementById('vocab-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const inputEl = document.getElementById('kr-word');
      const submitBtn = document.getElementById('submit-btn');
      const krWord = inputEl.value.trim();

      if (!krWord) return;

      submitBtn.innerText = "Translating...";
      submitBtn.disabled = true;

      try {
        const engDef = await translateKorean(krWord);
        const newCard = {
          id: Date.now(),
          kr: krWord,
          def: engDef
        };
        deck.unshift(newCard);
        saveDeck();
        renderDeck();
        inputEl.value = '';
      } catch (err) {
        alert("Failed to translate word. Please try again.");
      } finally {
        submitBtn.innerText = "Add to Deck";
        submitBtn.disabled = false;
      }
    });

    function deleteCard(id) {
      deck = deck.filter(card => card.id !== id);
      saveDeck();
      renderDeck();
    }

    function renderDeck() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const grid = document.getElementById('deck-grid');
      grid.innerHTML = '';

      const filtered = deck.filter(c => c.kr.toLowerCase().includes(query) || c.def.toLowerCase().includes(query));

      filtered.forEach(card => {
        const el = document.createElement('div');
        el.className = 'deck-card';
        el.innerHTML = `
          <button class="delete-btn" onclick="deleteCard(${card.id})">&times;</button>
          <h3>${card.kr}</h3>
          <div class="def">${card.def}</div>
        `;
        grid.appendChild(el);
      });
      document.getElementById('deck-count').innerText = deck.length;
    }

    /* Study Mode Functions */
    function initStudy() {
      if (deck.length === 0) {
        document.getElementById('front-word').innerText = "No cards!";
        document.getElementById('back-def').innerText = "Add words in Manage tab.";
        return;
      }
      currentIndex = 0;
      showCard();
    }

    function showCard() {
      const card = deck[currentIndex];
      const flashcard = document.getElementById('flashcard');
      flashcard.classList.remove('flipped');

      setTimeout(() => {
        document.getElementById('front-word').innerText = card.kr;
        document.getElementById('back-def').innerText = card.def;
      }, 150);
    }

    function flipCard() {
      document.getElementById('flashcard').classList.toggle('flipped');
    }

    function nextCard() {
      if (deck.length === 0) return;
      currentIndex = (currentIndex + 1) % deck.length;
      showCard();
    }

    // Initialize initial render
    saveDeck();
    renderDeck();
  </script>
</body>
</html>
